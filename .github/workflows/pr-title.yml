name: PR title

# Enforces Conventional Commits on the pull request title, which becomes the squashed
# commit subject on main. See CONTRIBUTING.md.

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  lint:
    name: Conventional commit
    runs-on: ubuntu-24.04
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            test
            build
            ci
            refactor
            perf
            chore
            revert
          scopes: |
            linux
            windows
            android
            engine
            config
            health
            dns
            cli
            daemon
            docs
            ci
            deps
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" must start with a lowercase character and describe the
            change, e.g. "feat(linux): add netlink endpoint adapter".
